<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadowdark Homebrew - Printable Sheet</title>
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="shared.js" defer></script>
  <script src="sheet.js" defer></script>
</head>
<body>
  <header class="hero hero--compact print-hide">
    <div class="hero__overlay"></div>
    <div class="hero__content wrap">
      <p class="eyebrow">Shadowdark Homebrew Edition</p>
      <h1>Printable Sheet</h1>
      <nav class="hero__actions">
        <a href="index.html" class="btn btn--gold">Builder</a>
        <a href="characters.html" class="btn btn--paper">Character Viewer</a>
        <a href="macros.html" class="btn btn--paper">Roll20 Macros</a>
        <a href="classes.html" class="btn btn--ink">Class Browser</a>
        <a href="rules.html" class="btn btn--ink">Rules Reference</a>
        <a href="randomizer.html" class="btn btn--ink">Randomizer</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="panel">
      <h2 id="sheetTitle">Printable Character Sheet</h2>
      <article id="sheet" class="sheet"></article>
      <div class="sheet-actions print-hide">
        <button id="printBtn" class="btn btn--gold" type="button">Print</button>
        <button id="toViewerBtn" class="btn btn--paper" type="button">Back To Viewer</button>
        <button id="toMacrosBtn" class="btn btn--ink" type="button">Open Macros</button>
        <button id="toBuilderBtn" class="btn btn--paper" type="button">Edit In Builder</button>
      </div>
    </section>
  </main>
</body>
</html>
