<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadowdark Homebrew - Class Browser</title>
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="shared.js" defer></script>
  <script src="classes.js" defer></script>
</head>
<body>
  <header class="hero hero--compact">
    <div class="hero__overlay"></div>
    <div class="hero__content wrap">
      <p class="eyebrow">Shadowdark Homebrew Edition</p>
      <h1>Custom Class Browser</h1>
      <nav class="hero__actions">
        <a href="index.html" class="btn btn--gold">Builder</a>
        <a href="characters.html" class="btn btn--paper">Character Viewer</a>
        <a href="sheet.html" class="btn btn--paper">Printable Sheet</a>
        <a href="macros.html" class="btn btn--ink">Roll20 Macros</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="panel">
      <h2>Carousel</h2>
      <div class="carousel-controls">
        <button id="prevClassBtn" class="btn btn--paper" type="button">Previous</button>
        <strong id="classIndex"></strong>
        <button id="nextClassBtn" class="btn btn--ink" type="button">Next</button>
      </div>
      <div id="classStage"></div>
      <div class="sheet-actions">
        <button id="toBuilderFromClassBtn" class="btn btn--gold" type="button">Create Character From This Class</button>
      </div>
    </section>
  </main>
</body>
</html>
